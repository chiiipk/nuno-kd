tag:
  - math_word_problems
task: olympiadbench
dataset_path: Hothan/OlympiadBench
dataset_name: OE_TO_maths_en_COMP
output_type: generate_until
training_split: null
fewshot_split: null
test_split: train
doc_to_text: "Problem: {{question}}\nAnswer:"
doc_to_target: !function olympiadbench_utils.doc_to_target
process_results: !function olympiadbench_utils.process_results
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until:
    - "Problem:"
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 5120
repeats: 1
num_fewshot: 0
metadata:
  version: 1.0
