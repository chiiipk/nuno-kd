[project]
name = "nuno-kd"
version = "0.1.0"
description = "LLM knowledge distillation: output-level KD plus hidden-state structural losses."
readme = "README.md"
requires-python = "==3.10.*"

# Training environment. The evaluator (lm-eval-harness + vLLM) lives in its own
# venv; see evaluation/setup.sh.
dependencies = [
    "accelerate",
    "deepspeed",
    "numpy",
    "pyyaml",
    "torch==2.10.0",
    "transformers==4.57.3",
]

[tool.uv]
index-url = "https://pypi.org/simple"
extra-index-url = ["https://download.pytorch.org/whl/cu128"]
index-strategy = "unsafe-best-match"
